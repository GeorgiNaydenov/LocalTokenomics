[project]
name = "ai-usage-cost"
version = "0.1.0"
description = "Local dashboard for Claude Code and Codex CLI token usage and API-equivalent cost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
png = ["matplotlib>=3.8"]
sql = ["datasette>=0.64"]
alert = ["apprise>=1.8"]
tui = ["textual>=0.80"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
ai-usage-cost = "ai_usage_cost.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_usage_cost"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
